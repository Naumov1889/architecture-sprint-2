name: mongo-sharding-repl  # имя развертывания

services:
  pymongo_api:
    container_name: pymongo_api
    build:
      context: api_app
      dockerfile: Dockerfile
    image: kazhem/pymongo_api:1.0.0
    depends_on:
      - mongos_router
    ports:
      - 8080:8080
    environment:
      MONGODB_URL: "mongodb://mongos_router:27020,mongos_router2:27027,mongos_router3:27028"
      MONGODB_DATABASE_NAME: "somedb"

  # сервер конфигурации
  configSrv:
    image: mongo:latest
    container_name: configSrv
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - config-data:/data/db
    command: [
        "--configsvr", # запуск в режиме конфигурации
        "--replSet",
        "config_server",
        "--bind_ip_all",
        "--port",
        "27017",
      ]
    healthcheck:
      test: ["CMD", "mongo", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      start_period: 10s

  configSrv2:
    image: mongo:latest
    container_name: configSrv2
    restart: always
    ports:
      - "27025:27025"
    volumes:
      - config-data-2:/data/db
    command: [
        "--configsvr",
        "--replSet",
        "config_server",
        "--bind_ip_all",
        "--port",
        "27025",
      ]
    healthcheck:
      test: ["CMD", "mongo", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      start_period: 10s

  configSrv3:
    image: mongo:latest
    container_name: configSrv3
    restart: always
    ports:
      - "27026:27026"
    volumes:
      - config-data-3:/data/db
    command: [
        "--configsvr",
        "--replSet",
        "config_server",
        "--bind_ip_all",
        "--port",
        "27026",
      ]
    healthcheck:
      test: ["CMD", "mongo", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      start_period: 10s


  # роутер
  mongos_router:
    image: mongo:latest
    container_name: mongos_router
    restart: always
    ports:
      - "27020:27020"
    command: [
        "mongos", # обычная mongo в режиме роутера
        "--configdb", # передача данных серваера конфигурации
        "config_server/configSrv:27017,configSrv2:27025,configSrv3:27026", # передача данных сервера конфигурации
        "--bind_ip_all",
        "--port",
        "27020",
      ]
    healthcheck:
      test: ["CMD", "mongo", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      start_period: 10s

  mongos_router2:
    image: mongo:latest
    container_name: mongos_router2
    restart: always
    ports:
      - "27027:27027"
    command: [
        "mongos",
        "--configdb",
        "config_server/configSrv:27017,configSrv2:27025,configSrv3:27026",
        "--bind_ip_all",
        "--port",
        "27027",
      ]
    healthcheck:
      test: ["CMD", "mongo", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      start_period: 10s

  mongos_router3:
    image: mongo:latest
    container_name: mongos_router3
    restart: always
    ports:
      - "27028:27028"
    command: [
        "mongos",
        "--configdb",
        "config_server/configSrv:27017,configSrv2:27025,configSrv3:27026",
        "--bind_ip_all",
        "--port",
        "27028",
      ]
    healthcheck:
      test: ["CMD", "mongo", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      start_period: 10s


  # 1-й шард
  shard1:
    image: mongo:latest
    container_name: shard1
    restart: always
    ports:
      - "27018:27018"
    volumes:
      - shard1-data:/data/db
    command: [
        "--shardsvr", # запуск в режиме шардинга
        "--replSet",
        "shard1", # название реплики
        "--bind_ip_all",
        "--port",
        "27018",
      ]
    healthcheck:
      test: ["CMD", "mongo", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      start_period: 10s

  # 1-й шард secondary-1
  shard1-secondary-1:
    image: mongo:latest
    container_name: shard1-secondary-1
    restart: always
    ports:
      - "27021:27021"
    volumes:
      - shard1-secondary-1-data:/data/db
    command: [
        "--shardsvr", # запуск в режиме шардинга
        "--replSet",
        "shard1", # название реплики
        "--bind_ip_all",
        "--port",
        "27021",
      ]
    healthcheck:
      test: ["CMD", "mongo", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      start_period: 10s

  # 1-й шард secondary-2
  shard1-secondary-2:
    image: mongo:latest
    container_name: shard1-secondary-2
    restart: always
    ports:
      - "27022:27022"
    volumes:
      - shard1-secondary-2-data:/data/db
    command: [
        "--shardsvr", # запуск в режиме шардинга
        "--replSet",
        "shard1", # название реплики
        "--bind_ip_all",
        "--port",
        "27022",
      ]
    healthcheck:
      test: ["CMD", "mongo", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      start_period: 10s

  # 2-й шард
  shard2:
    image: mongo:latest
    container_name: shard2
    restart: always
    ports:
      - "27019:27019"
    volumes:
      - shard2-data:/data/db
    command: [
        "--shardsvr", # запуск в режиме шардинга
        "--replSet",
        "shard2", # название реплик
        "--bind_ip_all", # обратите внимание - она отличается от реплики 1-го шарда
        "--port",
        "27019",
      ]
    healthcheck:
      test: ["CMD", "mongo", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      start_period: 10s

  # 2-й шард secondary-1
  shard2-secondary-1:
    image: mongo:latest
    container_name: shard2-secondary-1
    restart: always
    ports:
      - "27023:27023"
    volumes:
      - shard2-secondary-1-data:/data/db
    command: [
        "--shardsvr", # запуск в режиме шардинга
        "--replSet",
        "shard2", # название реплики
        "--bind_ip_all",
        "--port",
        "27023",
      ]
    healthcheck:
      test: ["CMD", "mongo", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      start_period: 10s

  # 2-й шард secondary-2
  shard2-secondary-2:
    image: mongo:latest
    container_name: shard2-secondary-2
    restart: always
    ports:
      - "27024:27024"
    volumes:
      - shard2-secondary-2-data:/data/db
    command: [
        "--shardsvr", # запуск в режиме шардинга
        "--replSet",
        "shard2", # название реплики
        "--bind_ip_all",
        "--port",
        "27024",
      ]
    healthcheck:
      test: ["CMD", "mongo", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      start_period: 10s

volumes:
  config-data:
  config-data-2:
  config-data-3:
  shard1-data:
  shard1-secondary-1-data:
  shard1-secondary-2-data:
  shard2-data:
  shard2-secondary-1-data:
  shard2-secondary-2-data:
